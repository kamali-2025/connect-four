<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro Connect Four - Purya Kamali</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com"></script>
</head>
<body>
  <div id="game-container">
    <p id="creator">Created by <span>Purya Kamali</span></p>
    <div id="controls">
      <button id="mode-btn" class="retro-btn">Mode: 1 Player (vs AI)</button>
      <button id="reset-score-btn" class="retro-btn secondary-btn">Reset Scores</button>
    </div>

    <div id="online-panel">
      <button id="host-btn" class="retro-btn">Create Online Room</button>
      <div id="join-box">
        <input type="text" id="room-input" placeholder="CODE" maxlength="4">
        <button id="join-btn" class="retro-btn secondary-btn">Join</button>
      </div>
      <p id="room-status"></p>
    </div>

    <div id="scoreboard">
      <div class="score-box yellow-score">YELLOW: <span id="yellow-wins">0</span></div>
      <div id="timer-box">TIME: <span id="timer">15</span>s</div>
      <div class="score-box pink-score"><span id="pink-label">AI</span>: <span id="pink-wins">0</span></div>
    </div>
    <div id="board"></div>
    <h1 class="title">C<span class="yellow-o">O</span>NNECT F<span class="pink-o">O</span>UR</h1>
    <p id="status">Yellow's Turn</p>
    <button id="reset-btn" class="retro-btn" style="display: none;">Play Again</button>
  </div>

  <script>
    const boardElement = document.getElementById("board");
    const statusElement = document.getElementById("status");
    const resetBtn = document.getElementById("reset-btn");
    const modeBtn = document.getElementById("mode-btn");
    const resetScoreBtn = document.getElementById("reset-score-btn");
    const yellowWinsEl = document.getElementById("yellow-wins");
    const pinkWinsEl = document.getElementById("pink-wins");
    const pinkLabelEl = document.getElementById("pink-label");
    const timerEl = document.getElementById("timer");
    const timerBox = document.getElementById("timer-box");

    const hostBtn = document.getElementById("host-btn");
    const joinBtn = document.getElementById("join-btn");
    const roomInput = document.getElementById("room-input");
    const roomStatus = document.getElementById("room-status");

    const ROWS = 6;
    const COLS = 7;
    const TURN_TIME = 15;

    let currentPlayer = "yellow";
    let gameOver = false;
    let vsAI = true;
    let aiThinking = false;
    let yellowScore = 0;
    let pinkScore = 0;
    let timeLeft = TURN_TIME;
    let timerInterval = null;
    let board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));

    let peer = null;
    let conn = null;
    let isOnline = false;
    let myOnlineColor = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, duration, type = "square", delay = 0) {
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    function playDropSound() {
      playTone(320, 0.08, "square", 0);
      playTone(180, 0.1, "square", 0.06);
    }

    function playWinSound() {
      const notes = new Array(523, 659, 784, 1046);
      notes.forEach((note, i) => playTone(note, 0.14, "square", i * 0.1));
    }

    function playTimeoutSound() {
      playTone(200, 0.15, "sawtooth", 0);
      playTone(140, 0.2, "sawtooth", 0.12);
    }

    function generateRoomCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";
      for (let i = 0; i < 4; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
      }
      return code;
    }

    function setupConnection(connection) {
      conn = connection;
      isOnline = true;
      vsAI = false;
      modeBtn.textContent = "Mode: Online 2P";
      pinkLabelEl.textContent = "PINK";
      yellowScore = 0;
      pinkScore = 0;
      yellowWinsEl.textContent = 0;
      pinkWinsEl.textContent = 0;
      resetGame();

      conn.on("data", (data) => {
        if (data.type === "move") {
          handleMove(data.col, true);
        } else if (data.type === "timeout") {
          switchTurn(true, true);
        } else if (data.type === "reset") {
          resetGame(true);
        }
      });

      conn.on("close", () => {
        roomStatus.textContent = "Friend disconnected.";
        isOnline = false;
        conn = null;
      });
    }

    hostBtn.addEventListener("click", () => {
      if (peer) peer.destroy();
      const code = generateRoomCode();
      roomStatus.textContent = "Creating room...";
      peer = new Peer("purya-c4-" + code);

      peer.on("open", () => {
        myOnlineColor = "yellow";
        roomStatus.textContent = `Room Code: ${code} (You are YELLOW - waiting for friend...)`;
      });

      peer.on("connection", (connection) => {
        connection.on("open", () => {
          roomStatus.textContent = `Connected! Room ${code} (You are YELLOW)`;
          setupConnection(connection);
        });
      });

      peer.on("error", () => {
        roomStatus.textContent = "Connection error. Try creating a new room.";
      });
    });

    joinBtn.addEventListener("click", () => {
      const code = roomInput.value.trim().toUpperCase();
      if (code.length !== 4) {
        roomStatus.textContent = "Enter the 4-letter Room Code first!";
        return;
      }
      if (peer) peer.destroy();
      roomStatus.textContent = `Joining room ${code}...`;
      peer = new Peer();

      peer.on("open", () => {
        myOnlineColor = "pink";
        const connection = peer.connect("purya-c4-" + code);
        connection.on("open", () => {
          roomStatus.textContent = `Connected to ${code}! (You are PINK)`;
          setupConnection(connection);
        });
        connection.on("error", () => {
          roomStatus.textContent = "Could not find room. Check the code!";
        });
      });
    });

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = TURN_TIME;
      timerEl.textContent = timeLeft;
      timerBox.classList.remove("urgent");

      if (gameOver || (vsAI && currentPlayer === "pink")) return;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;

        if (timeLeft <= 3 && timeLeft > 0) {
          timerBox.classList.add("urgent");
          playTone(600, 0.05, "square", 0);
        }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          if (!isOnline || currentPlayer === myOnlineColor) {
            playTimeoutSound();
            if (isOnline && conn) conn.send({ type: "timeout" });
            switchTurn(true, false);
          }
        }
      }, 1000);
    }

    function updateTurnText(prefix = "") {
      if (isOnline) {
        statusElement.textContent = currentPlayer === myOnlineColor
          ? `${prefix}Your Turn (${myOnlineColor.toUpperCase()})`
          : `${prefix}Waiting for friend...`;
      } else {
        statusElement.textContent = `${prefix}${currentPlayer === "yellow" ? "Yellow" : "Pink"}'s Turn`;
      }
    }

    function switchTurn(timedOut = false, fromRemote = false) {
      currentPlayer = currentPlayer === "yellow" ? "pink" : "yellow";
      const prefix = timedOut ? "Time's up! " : "";

      if (vsAI && currentPlayer === "pink") {
        clearInterval(timerInterval);
        timerBox.classList.remove("urgent");
        statusElement.textContent = `${prefix}Computer is thinking...`;
        aiThinking = true;
        setTimeout(() => {
          aiThinking = false;
          handleMove(chooseAIMove());
        }, 450);
      } else {
        updateTurnText(prefix);
        startTimer();
      }
    }

    function createBoard() {
      boardElement.innerHTML = "";
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const slot = document.createElement("div");
          slot.classList.add("slot");
          slot.dataset.row = r;
          slot.dataset.col = c;
          slot.addEventListener("click", () => {
            if (aiThinking) return;
            if (isOnline && currentPlayer !== myOnlineColor) return;
            handleMove(c, false);
          });
          boardElement.appendChild(slot);
        }
      }
    }

    function getAvailableRow(col) {
      for (let r = ROWS - 1; r >= 0; r--) {
        if (!board[r][col]) return r;
      }
      return -1;
    }

    function handleMove(col, fromRemote = false) {
      if (gameOver) return;
      const r = getAvailableRow(col);
      if (r === -1) return;

      if (isOnline && !fromRemote && conn) {
        conn.send({ type: "move", col: col });
      }

      clearInterval(timerInterval);
      board[r][col] = currentPlayer;
      const slot = document.querySelector(`.slot[data-row='${r}'][data-col='${col}']`);
      slot.classList.add(currentPlayer);
      playDropSound();

      const winningCells = checkWin(r, col, currentPlayer);
      if (winningCells) {
        gameOver = true;
        timerBox.classList.remove("urgent");
        highlightWinner(winningCells);
        playWinSound();

        if (currentPlayer === "yellow") {
          yellowScore++;
          yellowWinsEl.textContent = yellowScore;
        } else {
          pinkScore++;
          pinkWinsEl.textContent = pinkScore;
        }

        const winnerName = currentPlayer === "yellow" ? "Yellow" : (vsAI ? "Computer" : "Pink");
